[package]
name = "portctl"
version = "2.0.0"
edition = "2021"
authors = ["tackelua <tackelua@gmail.com>"]
description = "Lightweight, zero-daemon, local-first Port Manager and automated Edge Ingress CLI"
license = "MIT"
repository = "https://github.com/tackelua/portctl"
readme = "README.md"
keywords = ["port-manager", "portctl", "port-management", "cloudflare-tunnel", "devtool"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
dirs = "5.0"
regex = "1.10"
colored = "2.1"
comfy-table = "7.1"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
