[package]
name = "portctl-cli"
version = "2.0.0"
edition = "2021"
rust-version = "1.75.0"
authors = ["tackelua <tackelua@gmail.com>"]
description = "Lightweight, zero-daemon, local-first Port Manager and automated Edge Ingress CLI"
license = "MIT"
repository = "https://github.com/tackelua/portctl"
homepage = "https://github.com/tackelua/portctl"
documentation = "https://docs.rs/portctl-cli"
readme = "README.md"
keywords = ["port-manager", "portctl", "port-management", "cloudflare-tunnel", "devtool"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "portctl"
path = "src/lib.rs"

[[bin]]
name = "portctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
dirs = "7.0"
regex = "1.10"
colored = "2.1"
comfy-table = "7.1"
tempfile = "3.10"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
