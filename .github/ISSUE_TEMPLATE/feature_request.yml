name: 💡 Feature Request
description: Suggest an idea or enhancement for portctl
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate suggestions to make `portctl` better! Please explain the problem you are solving.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or limitation.
      placeholder: I am always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: It would be great if portctl could...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
