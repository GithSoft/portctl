name: 🐛 Bug Report
description: Report a reproducible problem or error in portctl
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please ensure you have tested with the latest release.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or commands to reproduce the behavior.
      placeholder: |
        1. Run 'portctl ...'
        2. Inspect output
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: portctl Version
      description: Output of `portctl --version`
      placeholder: "portctl 2.0.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System & Architecture
      description: e.g. macOS Sonoma (Apple Silicon M2), Ubuntu 24.04 (x86_64), Windows 11
      placeholder: "macOS Sonoma aarch64"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Additional Context & Logs
      description: Add any relevant command output, stack traces, or screenshots.
      render: shell
