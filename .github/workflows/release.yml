name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: portctl
            raw_name: portctl-linux-x86_64
            asset_name: portctl-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest # Intel macOS cross-compiled on Apple Silicon
            target: x86_64-apple-darwin
            artifact_name: portctl
            raw_name: portctl-darwin-x86_64
            asset_name: portctl-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz
          - os: macos-latest # Apple Silicon (M-series)
            target: aarch64-apple-darwin
            artifact_name: portctl
            raw_name: portctl-darwin-arm64
            asset_name: portctl-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: portctl.exe
            raw_name: portctl-windows-x86_64.exe
            asset_name: portctl-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package asset (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          cp ${{ matrix.artifact_name }} ../../../${{ matrix.raw_name }}
          tar -czf ../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }}
          cd ../../..
          shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Package asset (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Copy-Item ${{ matrix.artifact_name }} -Destination ../../../${{ matrix.raw_name }}
          Compress-Archive -Path ${{ matrix.artifact_name }} -DestinationPath ../../../${{ matrix.asset_name }}
          cd ../../..
          $hash = (Get-FileHash -Algorithm SHA256 ${{ matrix.asset_name }}).Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}" | Out-File -FilePath "${{ matrix.asset_name }}.sha256" -Encoding ascii

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
            ${{ matrix.raw_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
